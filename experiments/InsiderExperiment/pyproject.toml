[project]
name = "insider-experiment"
version = "0.1.0"
description = "Form 4 insider purchase replication. The power question is answered before the alpha question."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "C4", "T20"]
# N818 wants every exception to end in Error. CorpusBlocked, SealBreach and
# OperatorPriorMissing name the event rather than the class, and the event is
# what a reader of a ledger or a report needs to recognize.
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "T20", "PTH"]
"scripts/*" = ["T20"]
"src/insider/corpus/build.py" = ["T20"]
"src/insider/market/build.py" = ["T20"]
"src/insider/portfolio/build.py" = ["T20"]
"src/insider/power/report.py" = ["T20"]
"src/insider/corpus/validate.py" = ["T20"]
"scripts/refuse_env_commit.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/insider", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: reaches the SEC over the network",
    "slow: takes more than ten seconds",
]

[tool.coverage.run]
source = ["src/insider"]
branch = true
