[project]
name = "hfexperiment"
version = "0.1.0"
description = "H-F 12-1 cross-sectional momentum. Shadow series measures signal. Live series measures execution."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ib-async>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfexperiment"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["hfexperiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Verbatim copy from AiTrader. The logic is pinned by the reproduction
# gate and is not edited to satisfy a linter.
"src/hfexperiment/universe.py" = ["B905", "SIM110", "E501"]
