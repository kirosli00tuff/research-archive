repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: no-env-committed
        name: refuse to commit .env
        entry: python scripts/refuse_env_commit.py
        language: system
        pass_filenames: false
      - id: guards
        name: structural guards
        entry: python -m pytest tests/test_guards.py -q
        language: system
        pass_filenames: false
