[project]
name = "npd-experiment"
version = "0.1.0"
description = "Numeric prediction replication. Gate model gpt-5-2025-08-07 on a post-cutoff cross-sectional ranking task."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "python-dateutil>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npd"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "T20", "PTH"]
"src/npd/cli.py" = ["T20"]
"src/npd/collect/__main__.py" = ["T20"]
"src/npd/data/build.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/npd", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pandas.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits the real OpenAI API and spends money",
    "slow: takes more than ten seconds",
]

[tool.coverage.run]
source = ["src/npd"]
branch = true
