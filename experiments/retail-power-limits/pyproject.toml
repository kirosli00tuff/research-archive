[project]
name = "rplimits"
version = "0.1.0"
description = "A cross-experiment note on the retail power limit: four pre-registered experiments that closed on detectability rather than on a measured null. Holds no data, computes no statistic, and makes no claim about any market."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rplimits"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# RUF001: every figure string here must match the source repository and the
# rendered documents byte-for-byte. The minus sign is U+2212 where the source
# uses U+2212, and "fixing" it to a hyphen would silently break the drift
# check in tests/test_render.py that these strings exist to perform.
"rplimits/cases.py" = ["RUF001"]
"tests/test_honesty.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["rplimits", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
