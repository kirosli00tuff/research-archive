[project]
name = "mbtexperiment"
version = "0.1.0"
description = "Venue reachability measurement for the MBT variance-premium route. Reads margin and spread; transmits no order."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = [
    "ib-async>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_registration.py" = ["RUF001"]
"tests/test_honesty.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src/mbt", "tests", "tools"]
explicit_package_bases = true
mypy_path = "src:tests"

[[tool.mypy.overrides]]
module = ["ib_async.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
