# Pre-commit hooks run through uv so hook versions always match the locked
# environment rather than a separate pre-commit-managed one.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: guards
        name: structural guards, no-transmit scan, credential and account scan
        entry: uv run python -m pytest tests/test_guards.py tests/test_honesty.py -q
        language: system
        pass_filenames: false
